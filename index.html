<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Golden Vault XM</title>
    <style>
      /* Tawk default bubble, tooltip and badge: never show */
      #tawk-bubble-container,
      #tawk-tooltip-container,
      #tawk-minified-container,
      .tawk-min-container,
      .tawk-button { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
    </style>
    <script type="module" crossorigin src="/assets/index-d89211aa.js"></script>
    <link rel="stylesheet" href="/assets/index-8c622f01.css">
  </head>
  <body>
    <div id="root"></div>
    
    <script type="text/javascript">
      var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();

      /* ---------- Settings ---------- */
      var SIZE = 68, MARGIN = 8;
      var FALLBACK_MS = 5000;     /* wait before widgets appear (about your splash length) */
      var SHOW_DELAY_MS = 1000;   /* extra pause on top of that */
      var WELCOME_TEXT = "👋 Hi! Need help? Chat with us.";
      var HOME_MARKER = "initialize trading"; /* text that exists ONLY on your Home section */

      var ready = false, shown = false, chatOpen = false, welcomed = false;
      var popTimer = null, pendingMsg = null, lastUnread = 0;

      /* ---------- Home detection ---------- */
      function isHome() {
        if (typeof window.__gvHome === "boolean") return window.__gvHome;
        var root = document.getElementById("root");
        if (!root) return false;
        return (root.textContent || "").toLowerCase().indexOf(HOME_MARKER) !== -1;
      }

      /* ---------- Green chat bubble ---------- */
      var chatBtn = document.createElement("div");
      chatBtn.innerHTML =
        '<svg width="' + SIZE + '" height="' + SIZE + '" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="pointer-events:none">' +
        '<path fill="#00b341" d="M12 3C6.9 3 3 6.4 3 10.6c0 2.2 1 4.2 2.7 5.6-.1 1.2-.6 2.4-1.5 3.3-.2.2 0 .6.3.6 1.9-.1 3.4-.8 4.4-1.6.7.2 1.4.3 2.1.3 5.1 0 9-3.4 9-7.6S17.1 3 12 3z"/>' +
        '</svg>' +
        '<span id="gv-badge" style="display:none;position:absolute;top:2px;right:2px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:#e0245e;color:#fff;font:700 12px/20px -apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:center;pointer-events:none"></span>';
      chatBtn.style.cssText =
        "position:fixed;width:" + SIZE + "px;height:" + SIZE + "px;" +
        "display:none;align-items:center;justify-content:center;" +
        "cursor:grab;touch-action:none;user-select:none;z-index:2147483000;" +
        "filter:drop-shadow(0 4px 8px rgba(0,0,0,0.45));";

      /* ---------- Pop-up message ---------- */
      var popup = document.createElement("div");
      popup.innerHTML =
        '<span id="gv-pop-text"></span>' +
        '<span id="gv-pop-x" style="position:absolute;top:4px;right:9px;font-size:16px;color:#888;cursor:pointer;padding:2px 4px">×</span>';
      popup.style.cssText =
        "position:fixed;display:none;max-width:230px;padding:12px 26px 12px 14px;" +
        "background:#fff;color:#1c1e21;border-left:4px solid #00b341;border-radius:16px;" +
        "font:500 14px/1.35 -apple-system,Segoe UI,Roboto,Arial,sans-serif;" +
        "box-shadow:0 6px 24px rgba(0,0,0,0.25);cursor:pointer;z-index:2147483000;";

      /* ---------- Position (snaps to left or right edge only) ---------- */
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem("chatBtnPos")); } catch (e) {}
      var pos = {
        side: saved && saved.side === "left" ? "left" : "right",
        y: saved && typeof saved.y === "number" ? saved.y : window.innerHeight - 200
      };
      var dragX = 0, dragging = false;

      function edgeX(side) { return side === "left" ? MARGIN : window.innerWidth - SIZE - MARGIN; }
      function clampY(y) { return Math.min(Math.max(MARGIN, y), window.innerHeight - SIZE - MARGIN); }
      function placePopup() {
        popup.style.top = (clampY(pos.y) + 10) + "px";
        if (pos.side === "left") {
          popup.style.left = (MARGIN + SIZE + 10) + "px";
          popup.style.right = "auto";
        } else {
          popup.style.right = (MARGIN + SIZE + 10) + "px";
          popup.style.left = "auto";
        }
      }
      function render() {
        pos.y = clampY(pos.y);
        chatBtn.style.left = (dragging ? dragX : edgeX(pos.side)) + "px";
        chatBtn.style.top = pos.y + "px";
        placePopup();
      }
      render();
      window.addEventListener("resize", render);

      /* ---------- Dragging ---------- */
      var d = { active: false, moved: false, dx: 0, dy: 0, sx: 0, sy: 0 };

      chatBtn.addEventListener("pointerdown", function (e) {
        var rect = chatBtn.getBoundingClientRect();
        d = { active: true, moved: false, dx: e.clientX - rect.left, dy: e.clientY - rect.top, sx: e.clientX, sy: e.clientY };
        chatBtn.style.transition = "none";
        chatBtn.setPointerCapture(e.pointerId);
      });
      chatBtn.addEventListener("pointermove", function (e) {
        if (!d.active) return;
        if (Math.abs(e.clientX - d.sx) + Math.abs(e.clientY - d.sy) > 6) {
          d.moved = true; dragging = true; hidePopup();
        }
        if (!d.moved) return;
        dragX = Math.min(Math.max(0, e.clientX - d.dx), window.innerWidth - SIZE);
        pos.y = e.clientY - d.dy;
        render();
      });
      function endDrag() {
        if (!d.active) return;
        d.active = false;
        if (d.moved) {
          pos.side = (dragX + SIZE / 2 < window.innerWidth / 2) ? "left" : "right";
          dragging = false;
          chatBtn.style.transition = "left .25s ease, top .25s ease";
          render();
          try { localStorage.setItem("chatBtnPos", JSON.stringify(pos)); } catch (e) {}
        } else {
          openChat();
        }
      }
      chatBtn.addEventListener("pointerup", endDrag);
      chatBtn.addEventListener("pointercancel", endDrag);

      /* ---------- Chat / pop-up logic ---------- */
      function openChat() {
        hidePopup();
        try { Tawk_API.maximize(); } catch (e) {}
      }
      function hidePopup() {
        clearTimeout(popTimer);
        popup.style.display = "none";
      }
      function showPopup(text, ms) {
        if (!shown || !isHome() || chatOpen || chatBtn.style.display === "none") return;
        document.getElementById("gv-pop-text").textContent = text;
        placePopup();
        popup.style.display = "block";
        clearTimeout(popTimer);
        popTimer = setTimeout(hidePopup, ms || 12000);
      }
      popup.addEventListener("click", function (e) {
        if (e.target && e.target.id === "gv-pop-x") { hidePopup(); return; }
        openChat();
      });
      function setBadge(n) {
        var b = document.getElementById("gv-badge");
        if (!b) return;
        b.textContent = n > 9 ? "9+" : String(n);
        b.style.display = n > 0 ? "block" : "none";
      }

      /* Support message pop-up: shows now on Home, or waits until Home */
      function supportPopup(text) {
        if (chatOpen) return;
        if (text.length > 120) text = text.slice(0, 117) + "...";
        pendingMsg = "💬 " + text;
        flushPending();
      }
      function flushPending() {
        if (pendingMsg && shown && isHome() && !chatOpen) {
          var t = pendingMsg;
          pendingMsg = null;
          setTimeout(function () { showPopup(t, 15000); }, 400);
        }
      }

      document.body.appendChild(chatBtn);
      document.body.appendChild(popup);

      /* ---------- Home-only visibility ---------- */
      function killBubble() { if (!chatOpen) { try { Tawk_API.hideWidget(); } catch (e) {} } }

      function applyVisibility() {
        if (!shown) return;
        if (isHome()) {
          if (!chatOpen) chatBtn.style.display = "flex";
          if (!welcomed) {
            welcomed = true;
            setTimeout(function () { showPopup(WELCOME_TEXT, 12000); }, 2500);
          }
          flushPending();
        } else {
          hidePopup();
          chatBtn.style.display = "none";
          if (chatOpen) {
            chatOpen = false;
            try { Tawk_API.minimize(); } catch (e) {}
          }
          killBubble();
        }
      }

      /* Watch for section changes (the app does not change the web address) */
      var lastHome = null;
      setInterval(function () {
        var h = isHome();
        if (h !== lastHome) { lastHome = h; applyVisibility(); }
      }, 250);
      window.addEventListener("gv-page", applyVisibility);
      window.addEventListener("popstate", applyVisibility);

      /* ---------- Show only after the splash ---------- */
      function appReady() {
        if (ready) return;
        ready = true;
        setTimeout(function () { shown = true; applyVisibility(); }, SHOW_DELAY_MS);
      }
      window.addEventListener("gv-app-ready", appReady);
      setTimeout(appReady, FALLBACK_MS);

      /* ---------- Tawk events ---------- */
      Tawk_API.onLoad = killBubble;
      Tawk_API.onStatusChange = killBubble;

      /* Support agent message (with text) */
      Tawk_API.onChatMessageAgent = function (message) {
        var text = typeof message === "string"
          ? message
          : (message && (message.message || message.text)) || "New message from support";
        supportPopup(text);
        killBubble();
      };

      /* Backup: unread count went up but no text arrived */
      Tawk_API.onUnreadCountChanged = function (count) {
        setBadge(chatOpen ? 0 : count);
        if (!chatOpen && count > lastUnread && popup.style.display === "none" && !pendingMsg) {
          supportPopup("New message from support");
        }
        lastUnread = count;
        killBubble();
      };

      Tawk_API.onChatMaximized = function () {
        chatOpen = true;
        chatBtn.style.display = "none";
        hidePopup();
        pendingMsg = null;
        setBadge(0);
      };
      Tawk_API.onChatMinimized = function () { chatOpen = false; killBubble(); applyVisibility(); };
      Tawk_API.onChatEnded = function () { chatOpen = false; killBubble(); applyVisibility(); };

      /* ---------- Tawk script ---------- */
      (function () {
        var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
        s1.async = true;
        s1.src = "https://embed.tawk.to/6a2187aa4a36f41c2edf040c/1jq9nm3li";
        s1.charset = "UTF-8";
        s1.setAttribute("crossorigin", "*");
        s0.parentNode.insertBefore(s1, s0);
      })();
    </script>
  </body>
</html>
