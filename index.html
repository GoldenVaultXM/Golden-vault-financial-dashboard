    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Golden Vault XM</title>
    <style>
      /* Tawk default bubble, tooltip and badge: never show */
      #tawk-bubble-container,
      #tawk-tooltip-container,
      #tawk-minified-container,

      .tawk-button { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }

  <body>
    <div id="root"></div>
    
    <script type="text/javascript">
      var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();

      var SIZE = 56, MARGIN = 8;
      var FALLBACK_MS = 5000;   /* wait before widgets appear (about your splash length) */
      var SHOW_DELAY_MS = 1000; /* extra pause on top of that */
      var ready = false;

      /* ---------- Chat button (hidden until ready) ---------- */
      var chatBtn = document.createElement("div");
      chatBtn.innerHTML =
  '<svg width="56" height="56" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="pointer-events:none">' +
  '<path fill="#00b341" d="M12 3C6.9 3 3 6.4 3 10.6c0 2.2 1 4.2 2.7 5.6-.1 1.2-.6 2.4-1.5 3.3-.2.2 0 .6.3.6 1.9-.1 3.4-.8 4.4-1.6.7.2 1.4.3 2.1.3 5.1 0 9-3.4 9-7.6S17.1 3 12 3z"/>' +
  '</svg>';
chatBtn.style.cssText =
  "position:fixed;width:" + SIZE + "px;height:" + SIZE + "px;" +
  "display:none;align-items:center;justify-content:center;" +
  "cursor:grab;touch-action:none;user-select:none;z-index:2147483000;" +
  "filter:drop-shadow(0 4px 8px rgba(0,0,0,0.45));";

      /* ---------- Pop-up message ---------- */
      var popup = document.createElement("div");
      popup.innerHTML =
        '<span id="gv-pop-text">👋 Hi! Need help? Chat with us.</span>' +
        '<span id="gv-pop-x" style="position:absolute;top:4px;right:9px;font-size:16px;color:#888;cursor:pointer;padding:2px 4px">×</span>';
      popup.style.cssText =
        "position:fixed;display:none;max-width:210px;padding:12px 26px 12px 14px;" +
        "background:#fff;color:#1c1e21;border-radius:16px;font:500 14px/1.35 -apple-system,Segoe UI,Roboto,Arial,sans-serif;" +
        "box-shadow:0 6px 24px rgba(0,0,0,0.25);cursor:pointer;z-index:2147483000;";

      /* ---------- Position (snaps to left or right edge only) ---------- */
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem("chatBtnPos")); } catch (e) {}
      var pos = {
        side: saved && saved.side === "left" ? "left" : "right",
        y: saved && typeof saved.y === "number" ? saved.y : window.innerHeight - 160
      };
      var dragX = 0, dragging = false;

      function edgeX(side) {
        return side === "left" ? MARGIN : window.innerWidth - SIZE - MARGIN;
      }
      function clampY(y) {
        return Math.min(Math.max(MARGIN, y), window.innerHeight - SIZE - MARGIN);
      }
      function placePopup() {
        var y = clampY(pos.y);
        popup.style.top = (y + 6) + "px";
        if (pos.side === "left") {
          popup.style.left = (MARGIN + SIZE + 10) + "px";
          popup.style.right = "auto";
        } else {
          popup.style.right = (MARGIN + SIZE + 10) + "px";
          popup.style.left = "auto";
        }
      }
      function render() {
        pos.y = clampY(pos.y);
        chatBtn.style.left = (dragging ? dragX : edgeX(pos.side)) + "px";
        chatBtn.style.top = pos.y + "px";
        placePopup();
      }
      render();
      window.addEventListener("resize", render);

      /* ---------- Dragging ---------- */
      var d = { active: false, moved: false, dx: 0, dy: 0, sx: 0, sy: 0 };

      chatBtn.addEventListener("pointerdown", function (e) {
        var rect = chatBtn.getBoundingClientRect();
        d = { active: true, moved: false, dx: e.clientX - rect.left, dy: e.clientY - rect.top, sx: e.clientX, sy: e.clientY };
        chatBtn.style.transition = "none";
        chatBtn.setPointerCapture(e.pointerId);
      });
      chatBtn.addEventListener("pointermove", function (e) {
        if (!d.active) return;
        if (Math.abs(e.clientX - d.sx) + Math.abs(e.clientY - d.sy) > 6) {
          d.moved = true;
          dragging = true;
          hidePopup(true);
        }
        if (!d.moved) return;
        dragX = Math.min(Math.max(0, e.clientX - d.dx), window.innerWidth - SIZE);
        pos.y = e.clientY - d.dy;
        render();
      });
      function endDrag() {
        if (!d.active) return;
        d.active = false;
        if (d.moved) {
          pos.side = (dragX + SIZE / 2 < window.innerWidth / 2) ? "left" : "right";
          dragging = false;
          chatBtn.style.transition = "left .25s ease, top .25s ease";
          render();
          try { localStorage.setItem("chatBtnPos", JSON.stringify(pos)); } catch (e) {}
        } else {
          openChat();
        }
      }
      chatBtn.addEventListener("pointerup", endDrag);
      chatBtn.addEventListener("pointercancel", endDrag);

      /* ---------- Open chat / pop-up logic ---------- */
      function openChat() {
        hidePopup(true);
        try { Tawk_API.maximize(); } catch (e) {}
      }
      function hidePopup(remember) {
        popup.style.display = "none";
        if (remember) { try { sessionStorage.setItem("gvPopupSeen", "1"); } catch (e) {} }
      }
      function showPopup() {
        var seen = false;
        try { seen = sessionStorage.getItem("gvPopupSeen") === "1"; } catch (e) {}
        if (!ready || seen || chatBtn.style.display === "none") return;
        placePopup();
        popup.style.display = "block";
        setTimeout(function () { hidePopup(true); }, 12000);
      }
      popup.addEventListener("click", function (e) {
        if (e.target && e.target.id === "gv-pop-x") { hidePopup(true); return; }
        openChat();
      });

      document.body.appendChild(chatBtn);
      document.body.appendChild(popup);

      /* ---------- Show everything only after the splash ---------- */
      function appReady() {
        if (ready) return;
        ready = true;
        setTimeout(function () {
          chatBtn.style.display = "flex";
          setTimeout(showPopup, 3000);
        }, SHOW_DELAY_MS);
      }
      window.addEventListener("gv-app-ready", appReady);
      setTimeout(appReady, FALLBACK_MS);

      /* ---------- Tawk events ---------- */
      var chatOpen = false;
      function killBubble() { if (!chatOpen) { try { Tawk_API.hideWidget(); } catch (e) {} } }
      Tawk_API.onLoad = killBubble;
      Tawk_API.onStatusChange = killBubble;
      Tawk_API.onUnreadCountChanged = killBubble;
      Tawk_API.onChatMaximized = function () { chatOpen = true; chatBtn.style.display = "none"; hidePopup(true); };
      Tawk_API.onChatMinimized = function () { chatOpen = false; killBubble(); if (ready) chatBtn.style.display = "flex"; };
      Tawk_API.onChatEnded = function () { chatOpen = false; killBubble(); if (ready) chatBtn.style.display = "flex"; };

      /* ---------- Tawk script ---------- */
      (function () {
        var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
        s1.async = true;
        s1.src = "https://embed.tawk.to/6a2187aa4a36f41c2edf040c/1jq9nm3li";
        s1.charset = "UTF-8";
        s1.setAttribute("crossorigin", "*");
        s0.parentNode.insertBefore(s1, s0);
      })();
    </script>
